{% extends "base.html" %}
{% block title %}Post New Job{% endblock %}

{% block content %}
<div class="page-header">
  <div class="header-row">
    <div>
      <h1>Post New Job</h1>
      <p>Fill in the details — the job will go live after admin approval</p>
    </div>
    <a href="{{ url_for('company_jobs') }}" class="btn btn-gray">← Back</a>
  </div>
</div>

<div class="card" style="max-width:700px;">
  <form method="POST" action="{{ url_for('create_job') }}" data-validate>
    <div class="form-group">
      <label>Job Title <span style="color:var(--red);">*</span></label>
      <input type="text" name="title" placeholder="e.g. Software Engineer — Backend" required>
      <div class="err"></div>
    </div>

    <div class="form-group">
      <label>Job Description <span style="color:var(--red);">*</span></label>
      <textarea name="description" rows="5" placeholder="Describe the role, responsibilities, team, etc." required></textarea>
      <div class="err"></div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Required Skills</label>
        <input type="text" name="required_skills" placeholder="e.g. Python, Django, SQL">
        <div class="hint">Comma-separated list of skills</div>
      </div>
      <div class="form-group">
        <label>Experience Required</label>
        <input type="text" name="experience" placeholder="e.g. Fresher / 1–2 years">
      </div>
    </div>

    <div class="form-group">
      <label>Salary Range</label>
      <input type="text" name="salary_range" placeholder="e.g. ₹6–8 LPA or $60,000–$80,000">
    </div>

    <div style="display:flex;gap:10px;margin-top:6px;">
      <button type="submit" class="btn btn-primary">Submit for Approval</button>
      <a href="{{ url_for('company_jobs') }}" class="btn btn-gray">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
