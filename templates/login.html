{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block head %}
<style>
  .auth-card { background: var(--white); border: 1px solid var(--border); border-radius: 12px; padding: 32px 30px; }
  .auth-title { font-size: 1.3rem; font-weight: 700; color: var(--navy); margin-bottom: 4px; }
  .auth-sub { font-size: .85rem; color: var(--gray); margin-bottom: 24px; }
  .role-tabs { display: flex; background: var(--bg); border-radius: 8px; padding: 3px; margin-bottom: 22px; }
  .role-tabs button { flex: 1; padding: 7px; border: none; background: transparent; border-radius: 6px; font-size: .85rem; font-family: inherit; font-weight: 500; color: var(--gray); cursor: pointer; transition: all .13s; }
  .role-tabs button.active { background: var(--white); color: var(--blue); font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .auth-footer { text-align: center; font-size: .84rem; color: var(--gray); margin-top: 18px; }
  .auth-footer a { color: var(--blue); text-decoration: none; font-weight: 600; }
</style>
{% endblock %}

{% block content %}
<div class="auth-card">
  <div class="auth-title">Welcome back</div>
  <div class="auth-sub">Sign in to your account</div>

  <form method="POST" action="{{ url_for('login') }}" data-validate>
    <div class="role-tabs">
      <button type="button" class="active" onclick="setRole('student', this)">Student</button>
      <button type="button" onclick="setRole('company', this)">Company</button>
      <button type="button" onclick="setRole('admin', this)">Admin</button>
    </div>
    <input type="hidden" name="role" id="role-input" value="student">

    <div class="form-group">
      <label>Email address</label>
      <input type="email" name="email" placeholder="you@example.com" required autocomplete="email">
      <div class="err"></div>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
      <div class="err"></div>
    </div>

    <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:6px;">Sign In</button>
  </form>

  <div class="auth-footer">
    New here?
    <a href="{{ url_for('register', role='student') }}">Create student account</a>
    &nbsp;·&nbsp;
    <a href="{{ url_for('register', role='company') }}">Register company</a>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  function setRole(role, btn) {
    document.getElementById('role-input').value = role;
    document.querySelectorAll('.role-tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
</script>
{% endblock %}
